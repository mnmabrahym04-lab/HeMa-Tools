function renderHome(){
$('#app').innerHTML=`<section class="hero wrap"><div class="eyebrow">مساحتك الرقمية</div><h1>${t().heroTitle}</h1><p>${t().heroDesc}</p><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="${t().search}"></div><div class="hero-stats"><span><b id="count">0</b> ${t().toolsAvailable||'أداة'}</span></div></section><section class="section wrap"><div class="categories" id="cats">${['all','text','dev','image','pdf','media','productivity','numbers','time','random','health'].map(c=>`<button class="chip ${c==='all'?'active':''}" data-cat="${c}">${t()[c]||c}</button>`).join('')}</div><div class="tools-grid" id="grid"></div></section>`;
let cat='all',q='';
const draw=()=>{const list=TOOLS.filter(x=>{const co=cat==='all'||x.cat===cat;const hay=Object.values(x.name).join(' ')+' '+x.slug;return co&&hay.toLowerCase().includes(q)});$('#count').textContent=list.length;$('#grid').innerHTML=list.map(x=>`<a class="tool-card ${!R[x.slug]?'coming':''}" href="/tools/${x.slug}/"><div class="tool-top"><span class="tool-icon">${x.icon}</span></div><h3>${x.name[lang]||x.name.en}</h3><p>${x.desc[lang]||x.desc.en}</p><div class="tool-bottom"><span class="tool-tag">${t()[x.cat]||x.cat}</span></div></a>`).join('')||`<div class="empty">${t().noResults}</div>`};
$('#search').oninput=e=>{q=e.target.value.toLowerCase();draw()};$('#cats').onclick=e=>{const c=e.target.closest('[data-cat]');if(!c)return;cat=c.dataset.cat;document.querySelectorAll('#cats .chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');draw()};draw();
}
function renderToolPage(slug){
const tool=TOOLS.find(x=>x.slug===slug);if(!tool){render404();return}
document.title=`${tool.name[lang]||tool.name.en} — HeMa Tools`;
const isReady=R[slug];
$('#app').innerHTML=`<div class="wrap"><div class="page-head"><span style="font-size:48px">${tool.icon}</span><h1>${tool.name[lang]||tool.name.en}</h1><p>${tool.desc[lang]||tool.desc.en}</p></div><div class="tool-panel" id="toolPanel">${isReady?'':'<p style="text-align:center">هذه الأداة قريباً</p>'}</div><div style="text-align:center;margin:20px 0"><a href="/" class="action secondary">← رجوع</a></div></div>`;
if(isReady){const tObj=R[slug]();$('#toolPanel').innerHTML=tObj.html;try{tObj.wire()}catch(e){console.error(e)};}
}
function render404(){$('#app').innerHTML=`<div class="wrap"><div class="notfound"><h1>404</h1><a href="/" class="action">← رجوع</a></div></div>`;}
function render(){const p=location.pathname.replace(/\/+$/,'')||'/';if(p==='/')return renderHome();const m=p.match(/^\/tools\/([^/]+)$/);if(m)return renderToolPage(m[1]);return render404();}
function navigate(p){if(p===location.pathname)return;history.pushState({},'',p);window.scrollTo(0,0);render();}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||!a.href)return;try{const u=new URL(a.href);if(u.origin!==location.origin)return;e.preventDefault();navigate(u.pathname)}catch{}});
window.addEventListener('popstate',render);
$('#language').onchange=e=>{lang=e.target.value;render();};
$('#language').value=lang;$('#year').textContent=new Date().getFullYear();render();
</script>
