<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#080713;color:#f7f4ff;min-height:100vh;direction:rtl}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 14px}
header{border-bottom:1px solid #2a2542;padding:16px 0;position:sticky;top:0;background:#080713ee;backdrop-filter:blur(10px);z-index:10}
.brand{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#9b5cff,#ff4eb8);display:grid;place-items:center;color:#fff}
.hero{text-align:center;padding:60px 0 40px}
.hero h1{font-size:clamp(28px,5vw,48px);font-weight:900;margin-bottom:14px;line-height:1.2}
.grad{background:linear-gradient(90deg,#b58aff,#ff69c4,#58e8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#aaa4c2;font-size:16px;max-width:600px;margin:0 auto 24px}
.search{width:100%;max-width:500px;margin:0 auto;position:relative}
.search input{width:100%;height:52px;border-radius:14px;border:1px solid #3a2f5a;background:#131028;color:#f7f4ff;padding:0 18px;font-size:15px;outline:none}
.search input:focus{border-color:#9b5cff}
.stats{text-align:center;color:#aaa4c2;font-size:13px;margin-top:18px}
.cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:20px 0}
.chip{padding:7px 14px;border-radius:999px;border:1px solid #2a2542;background:#131028;color:#aaa4c2;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover,.chip.active{background:linear-gradient(100deg,#8d4dff55,#ed45ae33);color:#fff;border-color:#9b5cff88}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:20px 0 60px}
.card{border:1px solid #2a2542;border-radius:16px;background:#131028;padding:18px;transition:.2s;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:150px}
.card:hover{border-color:#9b5cff;transform:translateY(-2px)}
.card.coming{opacity:.6}
.card.coming::after{content:'قريبًا';background:#9b5cff;color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;align-self:flex-start}
.card-icon{font-size:32px;line-height:1}
.card-title{font-weight:700;font-size:15px}
.card-desc{color:#aaa4c2;font-size:12px;line-height:1.5;flex:1}
.card-tag{display:inline-block;font-size:10px;color:#c7a9ff;background:#9b5cff22;border:1px solid #9b5cff44;padding:2px 8px;border-radius:99px;align-self:flex-start}
.back{padding:16px 0;font-size:13px;color:#aaa4c2}
.back a{color:#7ceaff}
.tool-head{text-align:center;padding:30px 0 20px}
.tool-head .icon{font-size:52px;margin-bottom:10px}
.tool-head h1{font-size:clamp(22px,4vw,32px);font-weight:900;margin-bottom:8px}
.tool-head p{color:#aaa4c2;font-size:14px;max-width:600px;margin:0 auto}
.panel{max-width:640px;margin:0 auto 40px;border:1px solid #2a2542;border-radius:16px;background:#131028;padding:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#aaa4c2;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid #2a2542;border-radius:10px;background:#080713;color:#f7f4ff;padding:10px 12px;font-size:14px;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#9b5cff}
.field textarea{min-height:110px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
.btn{border:0;border-radius:10px;padding:11px 18px;color:#fff;font-weight:700;background:linear-gradient(100deg,#884cff,#e747b1 60%,#20bde9);cursor:pointer;font-size:14px}
.btn.sec{background:#131028;border:1px solid #2a2542;color:#f7f4ff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#080713;border:1px solid #2a2542;border-radius:10px;padding:12px;min-height:44px;font-size:12px;font-family:ui-monospace,monospace;margin-top:10px}
.notfound{text-align:center;padding:80px 20px}
.notfound h1{font-size:90px;background:linear-gradient(90deg,#b58aff,#ff69c4,#58e8ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px}
footer{border-top:1px solid #2a2542;padding:30px 0;text-align:center;color:#aaa4c2;font-size:12px;margin-top:40px}
footer a{color:#7ceaff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#131028;border:1px solid #2a2542;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:14px;min-height:130px}.card-icon{font-size:26px}.card-title{font-size:13px}.card-desc{font-size:11px}}
</style>

const CATS={all:'الكل',text:'نصوص',dev:'مبرمجين',image:'صور',pdf:'PDF',media:'وسائط',productivity:'إنتاجية',numbers:'أرقام',time:'وقت',random:'عشوائي',health:'صحة'};

// ═══════════════ أدوات مساعدة ═══════════════
const $=s=>document.querySelector(s);
const $in=id=>document.getElementById(id);
const txt=id=>$in(id)?.value||'';
const loadCDN=(url)=>new Promise((res,rej)=>{if(document.querySelector('script[src="'+url+'"]'))return res();const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
const setRes=(html,isHTML)=>{const r=$in('res');if(!r)return;if(isHTML)r.innerHTML=html;else r.textContent=html;};
const toast=(msg)=>{const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2000);};
const resultBox=()=>'<div class="field"><label>النتيجة</label><div class="result" id="res"></div></div>';
const ta=(label,id,ph)=>'<div class="field"><label>'+label+'</label><textarea id="'+id+'" placeholder="'+(ph||'')+'"></textarea></div>';
const inp=(label,id,type,val,attrs)=>'<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+(val||'')+'" '+(attrs||'')+'></div>';
const sel=(label,id,opts)=>'<div class="field"><label>'+label+'</label><select id="'+id+'">'+opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select></div>';

// ═══════════════ الأدوات ═══════════════
const R={};

R['word-counter']=()=>({html:ta('النص','in')+'<div class="result" id="res">0</div>',wire:()=>{$in('in').oninput=e=>{const s=e.target.value;setRes('كلمات: '+(s.trim().match(/\S+/g)||[]).length+' | حروف: '+s.length+' | أسطر: '+s.split('\n').length)}}});

R['case-converter']=()=>({html:ta('النص','in')+sel('التحويل','mode',[['upper','UPPER'],['lower','lower'],['title','Title'],['sentence','Sentence']])+'<div class="row"><button class="btn" id="go">تحويل</button></div>'+resultBox(),wire:()=>{$in('go').onclick=()=>{const s=txt('in'),m=txt('mode');let r;if(m==='upper')r=s.toUpperCase();else if(m==='lower')r=s.toLowerCase();else if(m==='title')r=s.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());else r=s.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g,c=>c.toUpperCase());setRes(r)}}});

R['text-cleaner']=()=>({html:ta('النص','in')+'<div class="row"><button class="btn" id="go">تنظيف</button></div>'+resultBox(),wire:()=>{$in('go').onclick=()=>setRes(txt('in').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim())}});

R['json-formatter']=()=>({html:ta('JSON','in')+'<div class="row"><button class="btn" id="fmt">تنسيق</button><button class="btn sec" id="min">ضغط</button></div>'+resultBox(),wire:()=>{$in('fmt').onclick=()=>{try{setRes(JSON.stringify(JSON.parse(txt('in')),null,2))}catch(e){setRes('❌ '+e.message)}};$in('min').onclick=()=>{try{setRes(JSON.stringify(JSON.parse(txt('in'))))}catch(e){setRes('❌ '+e.message)}}}});

R['base64-encoder']=()=>({html:ta('النص','in')+'<div class="row"><button class="btn" id="enc">تشفير</button><button class="btn sec" id="dec">فك</button></div>'+resultBox(),wire:()=>{$in('enc').onclick=()=>{try{setRes(btoa(unescape(encodeURIComponent(txt('in')))))}catch(e){setRes('❌')}};$in('dec').onclick=()=>{try{setRes(decodeURIComponent(escape(atob(txt('in').trim()))))}catch(e){setRes('❌')}}}});

R['url-encoder']=()=>({html:ta('الرابط','in')+'<div class="row"><button class="btn" id="enc">ترميز</button><button class="btn sec" id="dec">فك</button></div>'+resultBox(),wire:()=>{$in('enc').onclick=()=>setRes(encodeURIComponent(txt('in')));$in('dec').onclick=()=>{try{setRes(decodeURIComponent(txt('in')))}catch(e){setRes('❌')}}}});

R['password-generator']=()=>({html:inp('الطول','len','number','20')+'<div class="row"><button class="btn" id="go">توليد</button></div>'+resultBox(),wire:()=>{$in('go').onclick=()=>{const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+';const len=parseInt(txt('len'))||20;const arr=new Uint32Array(len);crypto.getRandomValues(arr);setRes(Array.from(arr,a=>chars[a%chars.length]).join(''))}}});

R['hash-generator']=()=>({html:ta('النص','in')+'<div class="row"><button class="btn" id="go">توليد SHA-256</button></div>'+resultBox(),wire:()=>{$in('go').onclick=async()=>{const enc=new TextEncoder().encode(txt('in'));const buf=await crypto.subtle.digest('SHA-256',enc);setRes([...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''))}}});

R['unit-converter']=()=>({html:inp('القيمة','in','number','1')+sel('النوع','t',[['km','كم'],['kg','كجم'],['c','مئوي']])+'<div class="row"><button class="btn" id="go">تحويل</button></div>'+resultBox(),wire:()=>{$in('go').onclick=()=>{const v=parseFloat(txt('in'))||0,t=txt('t');if(t==='km')setRes(v+' كم = '+(v*1000)+' متر\n'+v+' كم = '+(v*0.621371).toFixed(2)+' ميل');else if(t==='kg')setRes(v+' كجم = '+(v*1000)+' جرام\n'+v+' كجم = '+(v*2.20462).toFixed(2)+' باوند');else setRes(v+'°C = '+(v*9/5+32).toFixed(1)+'°F')}}});

R['pomodoro-timer']=()=>({html:'<div id="timer" style="font-size:60px;text-align:center;font-weight:900;color:#31d9ff;font-family:monospace;padding:20px 0">25:00</div><div class="row" style="justify-content:center"><button class="btn" id="start">بدء</button><button class="btn sec" id="stop">إيقاف</button><button class="btn sec" id="reset">إعادة</button></div>',wire:()=>{let t=25*60,i=null;const u=()=>$in('timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');$in('start').onclick=()=>{if(i)return;i=setInterval(()=>{if(t>0){t--;u()}else{clearInterval(i);i=null;alert('انتهى الوقت!')}},1000)};$in('stop').onclick=()=>{clearInterval(i);i=null};$in('reset').onclick=()=>{clearInterval(i);i=null;t=25*60;u()};u();}});

R['percentage-calculator']=()=>({html:inp('النسبة %','a','number','20')+inp('من الرقم','b','number','200')+'<div class="row"><button class="btn" id="p1">= نسبة</button><button class="btn sec" id="p2">= زيادة</button></div>'+inp('الرقم','x','number','100')+inp('النسبة %','y','number','15')+'<div class="row"><button class="btn sec" id="p3">± زيادة/نقص</button></div>'+resultBox(),wire:()=>{$in('p1').onclick=()=>setRes(txt('a')+'% من '+txt('b')+' = '+(parseFloat(txt('a'))||0)*(parseFloat(txt('b'))||0)/100);$in('p2').onclick=()=>setRes(txt('a')+' هو '+((parseFloat(txt('a'))||0)/(parseFloat(txt('b'))||1)*100).toFixed(2)+'% من '+txt('b'));$in('p3').onclick=()=>{const x=parseFloat(txt('x'))||0,y=parseFloat(txt('y'))||0;setRes('+'+y+'% → '+(x*(1+y/100)).toFixed(2)+'\n-'+y+'% → '+(x*(1-y/100)).toFixed(2))}}});

R['json-to-typescript']=()=>({html:ta('JSON','in','{"name":"HeMa","age":25}')+'<div class="row"><button class="btn" id="go">تحويل</button></div>'+resultBox(),wire:()=>{$in('go').onclick=()=>{try{const o=JSON.parse(txt('in'));let s='export interface RootObject {\n';for(const[k,v]of Object.entries(o)){let t=typeof v;if(v===null)t='null';else if(Array.isArray(v))t='any[]';s+='  '+k+': '+t+';\n'}setRes(s+'}')}catch(e){setRes('❌ '+e.message)}}}});

R['json-yaml']=()=>({html:ta('JSON','in','{"name":"HeMa"}')+'<div class="row"><button class="btn" id="go">تحويل</button></div>'+resultBox(),wire:()=>{$in('go').onclick=()=>{try{const o=JSON.parse(txt('in'));let s='';for(const[k,v]of Object.entries(o))s+=k+': '+(typeof v==='string'?'"'+v+'"':v)+'\n';setRes(s.trim())}catch(e){setRes('❌ '+e.message)}}}});

R['markdown-table']=()=>({html:inp('الأعمدة (مفصولة بفاصلة)','c','text','Name,Age,City')+ta('الصفوف (كل سطر صف)','r','Ali,25,Cairo\nSara,22,Alex')+'<div class="row"><button class="btn" id="go">توليد</button></div>'+resultBox(),wire:()=>{$in('go').onclick=()=>{const cols=txt('c').split(',');const rows=txt('r').split('\n').map(x=>x.split(','));let md='| '+cols.join(' | ')+' |\n|'+cols.map(()=>'---').join('|')+'|\n';rows.forEach(r=>{md+='| '+r.join(' | ')+' |\n'});setRes(md)}}});

R['http-status-codes']=()=>({html:'<div class="result" id="res" style="line-height:1.8"></div>',wire:()=>{const c={200:'OK - نجاح',201:'Created - تم الإنشاء',400:'Bad Request - طلب خاطئ',401:'Unauthorized - غير مصرح',403:'Forbidden - ممنوع',404:'Not Found - غير موجود',500:'Internal Server Error - خطأ بالسيرفر',502:'Bad Gateway',503:'Service Unavailable'};setRes(Object.entries(c).map(([k,v])=>k+': '+v).join('\n'))}});

R['mergepdf']=()=>({html:'<div class="field"><label>اختر ملفات PDF (2+)</label><input type="file" id="file" accept="application/pdf" multiple></div><div class="row"><button class="btn" id="go">دمج</button></div><div id="res"></div>',wire:()=>{$in('go').onclick=async()=>{await loadCDN('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');const f=$in('file').files;if(f.length<2){setRes('اختر ملفين على الأقل');return}try{const merged=await PDFLib.PDFDocument.create();for(let i=0;i<f.length;i++){const buf=await f[i].arrayBuffer();const doc=await PDFLib.PDFDocument.load(buf);const pages=await merged.copyPages(doc,doc.getPageIndices());pages.forEach(p=>merged.addPage(p))}const bytes=await merged.save();const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));$in('res').innerHTML='<a href="'+url+'" download="merged.pdf" style="color:#7ceaff;font-weight:bold;font-size:16px">⬇ تحميل PDF</a>'}catch(e){setRes('❌ '+e.message)}}}});

R['compresspdf']=()=>({html:'<div class="field"><label>اختر ملف PDF</label><input type="file" id="file" accept="application/pdf"></div><div class="row"><button class="btn" id="go">ضغط</button></div><div id="res"></div>',wire:()=>{$in('go').onclick=async()=>{await loadCDN('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');const f=$in('file').files[0];if(!f){setRes('اختر ملف');return}try{const buf=await f.arrayBuffer();const doc=await PDFLib.PDFDocument.load(buf);const bytes=await doc.save({useObjectStreams:true});const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const o=(f.size/1024).toFixed(0),n=(bytes.length/1024).toFixed(0);$in('res').innerHTML='✅ الأصلي: '+o+'KB → الجديد: '+n+'KB<br><a href="'+url+'" download="compressed.pdf" style="color:#7ceaff;font-weight:bold">⬇ تحميل</a>'}catch(e){setRes('❌ '+e.message)}}}});

R['barcode-generator']=()=>({html:inp('النص/الرقم','in','text','1234567890')+'<div class="row"><button class="btn" id="go">توليد</button></div><div id="res" style="text-align:center"></div>',wire:()=>{$in('go').onclick=async()=>{await loadCDN('https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');try{JsBarcode(svg,txt('in'),{format:'CODE128',background:'#fff',lineColor:'#000',width:2,height:80});$in('res').innerHTML='';svg.style.cssText='max-width:100%;margin-top:15px;border-radius:8px';$in('res').appendChild(svg)}catch(e){setRes('❌ '+e.message)}}}});

R['prompt-generator']=()=>({html:inp('الدور','role','text','خبير تسويق')+ta('المهمة','task','اكتب مقال عن AI')+sel('الأسلوب','style',[['formal','رسمي'],['casual','ودي'],['creative','إبداعي']])+ta('تفاصيل إضافية','extra','الجمهور: المبتدئين')+'<div class="row"><button class="btn" id="go">توليد</button></div>'+resultBox(),wire:()=>{$in('go').onclick=()=>setRes('Act as a '+txt('role')+'.\nTask: '+txt('task')+'\nStyle: '+txt('style')+'\nAdditional Details: '+txt('extra')+'\nFormat: Provide a well-structured response with clear headings and examples.')}});

/* ═══════════════ Router ═══════════════ */
function renderHome(){
$('#app').innerHTML='<section class="hero wrap"><div class="eyebrow">مساحتك الرقمية</div><h1>كل الأدوات في <span class="grad">مكان واحد</span></h1><p>أدوات مجانية سريعة وآمنة تعمل داخل متصفحك.</p><div class="search"><input id="search" type="search" placeholder="ابحث..."></div><div class="stats"><b id="count">0</b> أداة متاحة</div></section><section class="wrap"><div class="cats" id="cats">'+Object.entries(CATS).map(([k,v])=>'<button class="chip '+(k==='all'?'active':'')+'" data-cat="'+k+'">'+v+'</button>').join('')+'</div><div class="grid" id="grid"></div></section>';
let cat='all',q='';
const draw=()=>{const list=TOOLS.filter(x=>{const co=cat==='all'||x.cat===cat;const hay=(x.name+' '+x.desc+' '+x.slug).toLowerCase();return co&&hay.includes(q)});$('#count').textContent=list.length;$('#grid').innerHTML=list.map(x=>'<a class="card '+(R[x.slug]?'':'coming')+'" href="/tools/'+x.slug+'/"><div class="card-icon">'+x.icon+'</div><div class="card-title">'+x.name+'</div><div class="card-desc">'+x.desc+'</div><span class="card-tag">'+CATS[x.cat]+'</span></a>').join('')||'<div style="text-align:center;grid-column:1/-1;padding:40px;color:#aaa4c2">لا نتائج</div>'};
$('#search').oninput=e=>{q=e.target.value.toLowerCase();draw()};
$('#cats').onclick=e=>{const c=e.target.closest('[data-cat]');if(!c)return;cat=c.dataset.cat;document.querySelectorAll('#cats .chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');draw()};
draw();
}

function renderTool(slug){
const tool=TOOLS.find(x=>x.slug===slug);
if(!tool){render404();return}
document.title=tool.name+' — HeMa Tools';
const ready=R[slug];
$('#app').innerHTML='<div class="wrap"><div class="back"><a href="/">← الرئيسية</a></div><div class="tool-head"><div class="icon">'+tool.icon+'</div><h1>'+tool.name+'</h1><p>'+tool.desc+'</p></div><div class="panel" id="panel">'+(ready?'':'<div style="text-align:center;padding:40px;color:#aaa4c2"><div style="font-size:48px;margin-bottom:10px">🚧</div><p>هذه الأداة قيد التطوير وقريبًا ستكون متاحة.</p></div>')+'</div></div>';
if(ready){const t=R[slug]();$('#panel').innerHTML=t.html;try{t.wire()}catch(e){console.error(e)}}
}

function render404(){$('#app').innerHTML='<div class="wrap"><div class="notfound"><h1>404</h1><p style="color:#aaa4c2;margin:20px 0">الصفحة غير موجودة</p><a href="/" class="btn">← الرئيسية</a></div></div>'}

function render(){const p=location.pathname.replace(/\/+$/,'')||'/';if(p==='/')return renderHome();const m=p.match(/^\/tools\/([^/]+)$/);if(m)return renderTool(m[1]);return render404()}
function navigate(p){if(p===location.pathname)return;history.pushState({},'',p);window.scrollTo(0,0);render()}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||!a.href)return;try{const u=new URL(a.href);if(u.origin!==location.origin)return;e.preventDefault();navigate(u.pathname)}catch{}});
window.addEventListener('popstate',render);
document.getElementById('year').textContent=new Date().getFullYear();
render();
</script>
