const $=s=>document.querySelector(s);
const $in=id=>document.getElementById(id);
const txt=id=>$in(id)?.value||'';
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1900)}
async function copyText(txt){if(!txt){toast(t().copyFailed);return}try{await navigator.clipboard.writeText(txt);toast(t().copied)}catch{toast(t().copyFailed)}}
const setRes=(html,isHTML=false)=>{const r=$in('res');if(!r)return;if(isHTML)r.innerHTML=html;else r.textContent=html;};
const resultBlock=()=>`<div class="field"><label>${t().result}</label><div class="result" id="res"></div></div><div class="actions-row"><button class="action secondary" id="copyBtn">${t().copy}</button></div>`;
const textarea=(label,id,ph='')=>`<div class="field"><label>${label}</label><textarea id="${id}" placeholder="${ph}"></textarea></div>`;
const input=(label,id,type='text',val='',attrs='')=>`<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${val}" ${attrs}></div>`;

$in('go').onclick=()=>{const v=txt('in').trim();const map={M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};if(/^\d+$/.test(v)){let n=parseInt(v),r='';for(const[k,val]of Object.entries(map)){while(n>=val){r+=k;n-=val}}setRes(r)}else{let r=0;for(const[k,val]of Object.entries(map)){while(v.startsWith(k)){r+=val;v=v.slice(k.length)}}setRes(String(r))}}

R['random-number']=()=>({html:`${input('الحد الأدنى','min','number','1')}${input('الحد الأقصى','max','number','100')}${input('العدد','n','number','1','min="1" max="100"')}<div class="actions-row"><button class="action" id="go">توليد</button></div>${resultBlock()}`,wire:()=>{
$in('go').onclick=()=>{const min=parseInt(txt('min'))||0,max=parseInt(txt('max'))||100,n=Math.max(1,Math.min(100,parseInt(txt('n'))||1));const arr=[];for(let i=0;i<n;i++)arr.push(Math.floor(Math.random()*(max-min+1))+min);setRes(arr.join('\n'))}
}});

R['coin-dice']=()=>({html:`<div class="actions-row"><button class="action" id="coin">🪙 عملة</button><button class="action secondary" id="dice">🎲 نرد</button></div>${resultBlock()}`,wire:()=>{
$in('coin').onclick=()=>setRes(Math.random()<0.5?'🪙 صورة':'🪙 كتابة');
$in('dice').onclick=()=>setRes('🎲 '+(Math.floor(Math.random()*6)+1));
}});

R['reverse-text']=()=>({html:`${textarea('النص','in')}<div class="field"><label>النوع</label><select id="mode"><option value="chars">عكس الحروف</option><option value="words">عكس الكلمات</option><option value="lines">عكس الأسطر</option></select></div><div class="actions-row"><button class="action" id="go">عكس</button></div>${resultBlock()}`,wire:()=>{
$in('go').onclick=()=>{const s=txt('in'),m=txt('mode');if(m==='chars')setRes([...s].reverse().join(''));else if(m==='words')setRes(s.split(/\s+/).reverse().join(' '));else setRes(s.split('\n').reverse().join('\n'))}
}});

R['slug-generator']=()=>({html:`${textarea('النص','in','My Blog Post Title')}<div class="actions-row"><button class="action" id="go">توليد</button></div>${resultBlock()}`,wire:()=>{
$in('go').onclick=()=>setRes(txt('in').toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-'))
}});

/* ══════════ LAYOUTS ══════════ */
function setMeta(title,desc,url){
document.title=title;
let m=document.querySelector('meta[name="description"]');if(!m){m=document.createElement('meta');m.name='description';document.head.appendChild(m)}m.content=desc||'';
let og=document.querySelector('meta[property="og:title"]');if(!og){og=document.createElement('meta');og.setAttribute('property','og:title');document.head.appendChild(og)}og.content=title;
let ogu=document.querySelector('meta[property="og:url"]');if(!ogu){ogu=document.createElement('meta');ogu.setAttribute('property','og:url');document.head.appendChild(ogu)}ogu.content=SITE+url;
}

function renderHome(){
setMeta('HeMa Tools — 110 أداة رقمية مجانية','مجموعة أدوات رقمية مجانية: نصوص، صور، PDF، مطورين، تحويلات وأكثر.','/');
const cats=['all','text','dev','image','pdf','media','productivity','numbers','time','random','health'];
const app=$('#app');
app.innerHTML=`
<section class="hero wrap">
<div class="eyebrow">مساحتك الرقمية</div>
<h1>${t().heroTitle}</h1>
<p>${t().heroDesc}</p>
<div class="search-wrap"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="${t().search}" autocomplete="off"></div>
<div class="hero-stats"><span><b id="count">0</b> ${t().toolsAvailable}</span><span>⚡ ${t().fastSecure}</span></div>
</section>
<section class="section wrap">
<div class="section-head"><div><h2>${t().explore}</h2><p>${t().choose}</p></div></div>
<div class="categories" id="cats">${cats.map(c=>`<button class="chip ${c==='all'?'active':''}" data-cat="${c}">${t()[c]||c}</button>`).join('')}</div>
<div class="tools-grid" id="grid"></div>
</section>`;
let cat='all',q='';
const draw=()=>{
const list=TOOLS.filter(x=>{const catOK=cat==='all'||x.cat===cat;const hay=Object.values(x.name).join(' ')+' '+Object.values(x.desc).join(' ')+' '+x.slug;return catOK&&hay.toLowerCase().includes(q)});
$('#count').textContent=list.length;
$('#grid').innerHTML=list.map(x=>`<a class="tool-card ${!R[x.slug]?'coming':''}" href="/tools/${x.slug}/">
<div class="tool-top"><span class="tool-icon">${x.icon}</span><button class="fav ${favorites.includes(x.id)?'on':''}" data-fav="${x.id}">♥</button></div>
<h3>${x.name[lang]||x.name.en}</h3><p>${x.desc[lang]||x.desc.en}</p>
<div class="tool-bottom"><span class="tool-tag">${t()[x.cat]||x.cat}</span></div></a>`).join('')||`<div class="empty">${t().noResults}</div>`;
};
$('#search').oninput=e=>{q=e.target.value.toLowerCase().trim();draw()};
$('#cats').onclick=e=>{const c=e.target.closest('[data-cat]');if(!c)return;cat=c.dataset.cat;document.querySelectorAll('#cats .chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');draw()};
$('#grid').addEventListener('click',e=>{
const f=e.target.closest('[data-fav]');if(f){e.preventDefault();const id=f.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];LS.set('hema_favs',JSON.stringify(favorites));f.classList.toggle('on');}
});
draw();
}

<div class="breadcrumb"><a href="/">${t().home}</a> / <a href="/category/${tool.cat}/">${t()[tool.cat]||tool.cat}</a> / ${tool.name[lang]||tool.name.en}</div>
<div class="page-head"><span style="font-size:48px">${tool.icon}</span><h1>${tool.name[lang]||tool.name.en}</h1><p>${tool.desc[lang]||tool.desc.en}</p></div>
<div class="tool-panel" id="toolPanel">${isReady?'':'<div style="text-align:center;padding:40px 15px;color:var(--muted)"><div style="font-size:48px;margin-bottom:10px">🚧</div><p>هذه الأداة قيد التطوير وقريبًا ستكون متاحة.</p></div>'}</div>

<details class="faq-item"><summary>هل بياناتي آمنة؟</summary><p>نعم. معظم الأدوات تعالج البيانات داخل المتصفح دون رفعها لأي سيرفر.</p></details>

</div>`;
if(isReady){const tObj=R[slug]();$('#toolPanel').innerHTML=tObj.html;try{tObj.wire()}catch(e){console.error(e)};const cb=$in('copyBtn');if(cb)cb.onclick=()=>copyText($in('res')?.textContent||'');}
}

function renderStaticPage(key){
const p=STATIC_PAGES[key];
if(!p){render404();return}
setMeta(`${key} — HeMa Tools`,'',`/${key}/`);
$('#app').innerHTML=`<div class="wrap"><div class="breadcrumb"><a href="/">${t().home}</a> / ${key}</div><div class="tool-panel">${p[lang]||p.ar}</div></div>`;
}

function render404(){
setMeta('404 — HeMa Tools','',location.pathname);
$('#app').innerHTML=`<div class="wrap"><div class="notfound"><h1>404</h1><p style="color:var(--muted);font-size:16px;margin:20px 0">${t().notFoundDesc}</p><a href="/" class="action" style="display:inline-block">← ${t().home}</a></div></div>`;
}

/* ══════════ ROUTER ══════════ */
function render(){
const path=location.pathname.replace(/\/+$/,'')||'/';
if(path==='/'||path==='')return renderHome();
const tm=path.match(/^\/tools\/([^/]+)$/);if(tm)return renderToolPage(tm[1]);
const cm=path.match(/^\/category\/([^/]+)$/);if(cm)return renderCategory(cm[1]);
const sm=path.match(/^\/([^/]+)$/);if(sm&&STATIC_PAGES[sm[1]])return renderStaticPage(sm[1]);
return render404();
}
function navigate(path){
if(path===location.pathname)return;
history.pushState({path},'',path);
window.scrollTo(0,0);
render();
}
document.addEventListener('click',e=>{
const a=e.target.closest('a');
if(!a||!a.href)return;
try{const u=new URL(a.href);if(u.origin!==location.origin)return;
if(a.hasAttribute('data-fav'))return;
e.preventDefault();navigate(u.pathname);
}catch{}
});
window.addEventListener('popstate',render);

/* ══════════ THEME + LANG ══════════ */
function applyTheme(){document.body.classList.toggle('light',theme==='light');$('#theme').value=theme;LS.set('hema_theme',theme)}
$('#theme').onchange=e=>{theme=e.target.value;applyTheme()};
$('#language').onchange=e=>{lang=e.target.value;LS.set('hema_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';render()};
$('#language').value=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
applyTheme();
$('#year').textContent=new Date().getFullYear();

/* ══════════ INIT ══════════ */
render();
</script>
